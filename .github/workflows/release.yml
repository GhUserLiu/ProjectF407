# STM32F407 项目发布工作流
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ========== 创建发布 ==========
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 获取版本号
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: 创建发布
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: STM32F407 项目 ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false

  # ========== 构建发布包 ==========
  build-release:
    name: Build Release Package
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: 打包 GUI 应用
      run: |
        cd tools/gui_app
        pyinstaller build.spec --clean --noconfirm || true
    
    - name: 创建发布包
      run: |
        mkdir -p release
        tar --exclude=release --exclude=.git --exclude=__pycache__ \
            --exclude=*.pyc -czf release/stm32f407-project.tar.gz .
    
    - name: 上传发布包
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: release/stm32f407-project.tar.gz
